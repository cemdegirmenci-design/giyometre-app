adline-md": ["Montserrat"], "label-caps": ["Montserrat"], "headline-lg": ["Montserrat"], "body-sm": ["Montserrat"] }, "fontSize": { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "button-text": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }], "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface-container-lowest font-body-lg text-on-surface antialiased"><main class="min-h-screen bg-surface-container-lowest"><div class="flex flex-col w-full bg-surface-container-lowest p-[20px] justify-between relative overflow-hidden" style="height:100vh; height:100dvh;" id="ciktilar-screen">

<h1 class="font-headline-lg font-bold text-primary-container tracking-tight" style="font-size: clamp(20px, 6vw, 26px); font-weight:700;">Çıktılar</h1>
<span class="text-[13px] text-on-surface-variant -mt-4">Oluşturmak istediğin belgeyi seç.</span>

<div class="flex flex-col gap-3 w-full">
<button type="button" id="btn-teklif" class="w-full h-[56px] rounded-full bg-primary-container text-on-primary font-button-text flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-[0.98]">

</button>
<button type="button" id="btn-cam" class="w-full h-[56px] rounded-full bg-primary-container text-on-primary font-button-text flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">description</span>
<span class="text-[15px]">CAM SİPARİŞ FORMU</span>
</button>
<button type="button" id="btn-malzeme" class="w-full h-[56px] rounded-full bg-primary-container text-on-primary font-button-text flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">description</span>
<span class="text-[15px]">MALZEME SİPARİŞ FORMU</span>
</button>
<button type="button" id="btn-kesim" class="w-full h-[56px] rounded-full bg-primary-container text-on-primary font-button-text flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">description</span>
<span class="text-[15px]">KESİM OPTİMİZASYON TABLOSU</span>
</button>
</div>
</div>
<!-- Bottom Nav -->
<div class="w-full pb-4 pt-6 flex gap-3" style="transform: translateY(-28px);">
<button id="back-btn" class="flex-1 h-[56px] rounded-full border-2 border-primary text-primary font-button-text flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
<span class="text-[16px]">GERİ</span>
</button>
</div>
</div>
<script>
  // Minik buton tık sesi — Web Audio ile üretilir, harici dosya gerekmez.
  var audioCtx = null;
  function playClickTone() {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var t0 = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 700;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.1, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.07);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.09);
  }

  document.getElementById('back-btn').addEventListener('click', function() {
    playClickTone();
    window.location.href = '../giyometre_fiyat_parametreleri/code.html';
  });
  document.getElementById('btn-teklif').addEventListener('click', function() {
    playClickTone();
    window.location.href = '../giyometre_teklif_ciktisi/code.html';
  });
  document.getElementById('btn-cam').addEventListener('click', function() {
    playClickTone();
    window.location.href = '../giyometre_cam_siparis_formu/code.html';
  });
  document.getElementById('btn-malzeme').addEventListener('click', function() {
    playClickTone();
    window.location.href = '../giyometre_malzeme_siparis_formu/code.html';
  });
  document.getElementById('btn-kesim').addEventListener('click', function() {
    playClickTone();
    window.location.href = '../giyometre_kesim_optimizasyon_tablosu/code.html';
  });
</script>
