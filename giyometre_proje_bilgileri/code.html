<!DOCTYPE html>

<html lang="tr" style=""><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container": "#ffeae0", "on-error-container": "#93000a", "on-primary-fixed": "#331200", "secondary-container": "#cdd9fe", "surface-bright": "#fff8f6", "on-secondary-fixed-variant": "#3a4664", "on-secondary": "#ffffff", "outline": "#8c7164", "error": "#ba1a1a", "secondary": "#515e7d", "on-tertiary-fixed-variant": "#004a77", "on-surface-variant": "#584236", "primary-container": "#f5710c", "tertiary-container": "#009ef6", "on-surface": "#251912", "inverse-surface": "#3b2d26", "on-primary": "#ffffff", "surface-container-low": "#fff1eb", "secondary-fixed-dim": "#b9c6ea", "surface-container-highest": "#f6ded3", "primary-fixed-dim": "#ffb68f", "on-secondary-container": "#525f7e", "on-primary-container": "#532100", "surface": "#fff8f6", "primary": "#9c4400", "surface-dim": "#edd5ca", "primary-fixed": "#ffdbca", "on-secondary-fixed": "#0d1b36", "surface-container-lowest": "#ffffff", "outline-variant": "#e0c0b0", "on-background": "#251912", "surface-variant": "#f6ded3", "surface-container-high": "#fbe3d8", "error-container": "#ffdad6", "on-tertiary": "#ffffff", "tertiary-fixed-dim": "#98cbff", "tertiary-fixed": "#cee5ff", "secondary-fixed": "#d9e2ff", "on-tertiary-fixed": "#001d33", "on-error": "#ffffff", "background": "#fff8f6", "on-tertiary-container": "#003253", "inverse-on-surface": "#ffede5", "tertiary": "#00639c", "inverse-primary": "#ffb68f", "surface-tint": "#9c4400", "on-primary-fixed-variant": "#773200" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "container-padding": "20px", "stack-gap": "16px", "grid-margin": "20px", "element-gap": "12px" }, "fontFamily": { "body-lg": ["Montserrat"], "button-text": ["Montserrat"], "headline-md": ["Montserrat"], "label-caps": ["Montserrat"], "headline-lg": ["Montserrat"], "body-sm": ["Montserrat"] }, "fontSize": { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "button-text": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }], "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface-container-lowest font-body-lg text-on-surface antialiased"><main class="min-h-screen bg-surface-container-lowest"><div class="flex flex-col w-full bg-surface-container-lowest p-[20px] justify-between relative overflow-hidden" style="height:100vh; height:100dvh;" id="proje-bilgileri-screen">
<!-- Content -->
<div class="flex flex-col w-full gap-6 flex-1 overflow-y-auto pt-2 pb-4">
<h1 class="font-headline-lg font-bold text-primary-container tracking-tight" style="font-size: clamp(20px, 6vw, 26px); font-weight:700;">Proje Bilgileri</h1>
<div class="flex flex-col gap-5 w-full">
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-caps text-secondary" for="f-unvan">MÜŞTERİ ÜNVANI</label>
<input id="f-unvan" type="text" placeholder="Örn: ABC Lojistik A.Ş." class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary font-body-lg text-on-surface py-2 outline-none placeholder:text-outline transition-colors"/>
</div>
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-caps text-secondary" for="f-ilgili">İLGİLİ KİŞİ</label>
<input id="f-ilgili" type="text" placeholder="Ad Soyad" class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary font-body-lg text-on-surface py-2 outline-none placeholder:text-outline transition-colors"/>
</div>
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-caps text-secondary" for="f-mail">İLGİLİ KİŞİ MAİL</label>
<input id="f-mail" type="email" placeholder="ornek@sirket.com" class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary font-body-lg text-on-surface py-2 outline-none placeholder:text-outline transition-colors"/>
</div>
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-caps text-secondary" for="f-tel">İLGİLİ KİŞİ MOBİL TELEFON</label>
<input id="f-tel" type="text" inputmode="numeric" value="05" class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary font-body-lg text-on-surface py-2 outline-none placeholder:text-outline transition-colors"/>
</div>
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-caps text-secondary" for="f-proje-isim">PROJE İSMİ</label>
<input id="f-proje-isim" type="text" placeholder="Proje Adı" class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary font-body-lg text-on-surface py-2 outline-none placeholder:text-outline transition-colors"/>
</div>
<div class="flex gap-3 w-full">
<div class="flex flex-col gap-1.5 w-1/2">
<label class="font-label-caps text-secondary" for="f-sehir">ŞEHİR</label>
<input id="f-sehir" type="text" placeholder="Örn: İstanbul" class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary font-body-lg text-on-surface py-2 outline-none placeholder:text-outline transition-colors"/>
</div>
<div class="flex flex-col gap-1.5 w-1/2">
<label class="font-label-caps text-secondary" for="f-ilce">İLÇE</label>
<input id="f-ilce" type="text" placeholder="Örn: Kadıköy" class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary font-body-lg text-on-surface py-2 outline-none placeholder:text-outline transition-colors"/>
</div>
</div>
</div>
</div>
<!-- Bottom Nav -->
<div class="w-full pb-4 pt-6 flex gap-3 mb-[28px]">
<button id="back-btn" class="flex-1 h-[56px] rounded-full border-2 border-primary text-primary font-button-text flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
<span class="text-[16px]">GERİ</span>
</button>
<button id="next-btn" class="flex-1 h-[56px] rounded-full bg-primary-container text-on-primary font-button-text flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-[0.98]">
<span class="text-[16px]">İLERİ</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  var telInput = document.getElementById('f-tel');

  function formatTel(digits) {
    var body = digits.slice(2);
    var g1 = body.slice(0, 2), g2 = body.slice(2, 5), g3 = body.slice(5, 7), g4 = body.slice(7, 9);
    var out = '05' + g1;
    if (g2) out += ' ' + g2;
    if (g3) out += ' ' + g3;
    if (g4) out += ' ' + g4;
    return out;
  }

  telInput.addEventListener('input', function() {
    var digits = telInput.value.replace(/[^0-9]/g, '');
    if (digits.slice(0, 2) !== '05') {
      digits = '05' + digits.replace(/^0*5*/, '');
    }
    digits = digits.slice(0, 11);
    telInput.value = formatTel(digits);
  });
  telInput.addEventListener('keydown', function(e) {
    var isDigit = e.key >= '0' && e.key <= '9';
    var isControlKey = ['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].indexOf(e.key) !== -1;
    if (!isDigit && !isControlKey && !e.ctrlKey && !e.metaKey) e.preventDefault();
    if ((e.key === 'Backspace' || e.key === 'Delete') && telInput.selectionStart <= 2 && telInput.selectionEnd <= 2) {
      e.preventDefault();
    }
  });
  telInput.addEventListener('focus', function() {
    if (telInput.selectionStart < 2) telInput.setSelectionRange(telInput.value.length, telInput.value.length);
  });

  document.getElementById('back-btn').addEventListener('click', function() {
    window.location.href = '../giyometre_acilis/code.html';
  });
  document.getElementById('next-btn').addEventListener('click', function() {
    var state = JSON.parse(localStorage.getItem('giyometreState') || '{}');
    state.unvan = document.getElementById('f-unvan').value;
    state.ilgili = document.getElementById('f-ilgili').value;
    state.mail = document.getElementById('f-mail').value;
    state.tel = telInput.value;
    state.projeIsim = document.getElementById('f-proje-isim').value;
    state.sehir = document.getElementById('f-sehir').value;
    state.ilce = document.getElementById('f-ilce').value;
    state.projeYeri = state.sehir + (state.ilce ? ' / ' + state.ilce : '');
    localStorage.setItem('giyometreState', JSON.stringify(state));
    window.location.href = '../giyometre_urun_secimleri/code.html';
  });
</script></main>
</body></html>
