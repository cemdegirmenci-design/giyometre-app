<!DOCTYPE html>

<html lang="tr" style=""><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container": "#ffeae0", "on-error-container": "#93000a", "on-primary-fixed": "#331200", "secondary-container": "#cdd9fe", "surface-bright": "#fff8f6", "on-secondary-fixed-variant": "#3a4664", "on-secondary": "#ffffff", "outline": "#8c7164", "error": "#ba1a1a", "secondary": "#515e7d", "on-tertiary-fixed-variant": "#004a77", "on-surface-variant": "#584236", "primary-container": "#f5710c", "tertiary-container": "#009ef6", "on-surface": "#251912", "inverse-surface": "#3b2d26", "on-primary": "#ffffff", "surface-container-low": "#fff1eb", "secondary-fixed-dim": "#b9c6ea", "surface-container-highest": "#f6ded3", "primary-fixed-dim": "#ffb68f", "on-secondary-container": "#525f7e", "on-primary-container": "#532100", "surface": "#fff8f6", "primary": "#9c4400", "surface-dim": "#edd5ca", "primary-fixed": "#ffdbca", "on-secondary-fixed": "#0d1b36", "surface-container-lowest": "#ffffff", "outline-variant": "#e0c0b0", "on-background": "#251912", "surface-variant": "#f6ded3", "surface-container-high": "#fbe3d8", "error-container": "#ffdad6", "on-tertiary": "#ffffff", "tertiary-fixed-dim": "#98cbff", "tertiary-fixed": "#cee5ff", "secondary-fixed": "#d9e2ff", "on-tertiary-fixed": "#001d33", "on-error": "#ffffff", "background": "#fff8f6", "on-tertiary-container": "#003253", "inverse-on-surface": "#ffede5", "tertiary": "#00639c", "inverse-primary": "#ffb68f", "surface-tint": "#9c4400", "on-primary-fixed-variant": "#773200" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "container-padding": "20px", "stack-gap": "16px", "grid-margin": "20px", "element-gap": "12px" }, "fontFamily": { "body-lg": ["Montserrat"], "button-text": ["Montserrat"], "headline-md": ["Montserrat"], "label-caps": ["Montserrat"], "headline-lg": ["Montserrat"], "body-sm": ["Montserrat"] }, "fontSize": { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "button-text": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }], "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }] } } } };</script><style>
.pill-choice { border: 2px solid #e0c0b0; color: #251912; background: transparent; }
.pill-choice.selected-cam { background: #0d9488; border-color: #0d9488; color: #ffffff; }
.pill-choice.selected-renk { background: #292524; border-color: #292524; color: #ffffff; }
.pill-choice.selected-aksesuar { background: #ca8a04; border-color: #ca8a04; color: #ffffff; }
</style></head><body class="bg-surface-container-lowest font-body-lg text-on-surface antialiased"><main class="min-h-screen bg-surface-container-lowest"><div class="flex flex-col w-full h-full min-h-[800px] bg-surface-container-lowest p-[20px] justify-between relative overflow-hidden" id="urun-secimleri-screen">
<!-- Content -->
<div class="flex flex-col w-full gap-6 flex-1 overflow-y-auto pt-2 pb-4">
<h1 class="font-headline-lg font-bold text-primary-container tracking-tight" style="font-size: clamp(20px, 6vw, 26px); font-weight:700;">Ürün Seçimleri</h1>

<!-- Cam Ozelligi -->
<div class="flex flex-col gap-2 w-full">
<span class="font-label-caps text-secondary">CAM ÖZELLİĞİ</span>
<p class="text-[12px] text-on-surface-variant leading-snug">Isı cam 4 mm tmp + 16mm hb + 4 mm tmp silikon dolgu</p>
<div class="flex flex-wrap gap-2 mt-1" data-group="cam">
<button type="button" class="pill-choice selected-cam px-4 py-2 rounded-full font-button-text text-[13px] transition-colors selected" data-value="Şeffaf">Şeffaf</button>
<button type="button" class="pill-choice selected-cam px-4 py-2 rounded-full font-button-text text-[13px] transition-colors" data-value="Konfor">Konfor</button>
<button type="button" class="pill-choice selected-cam px-4 py-2 rounded-full font-button-text text-[13px] transition-colors" data-value="Füme/Mavi/Yeşil">Füme/Mavi/Yeşil</button>
</div>
</div>

<!-- Profil Rengi -->
<div class="flex flex-col gap-2 w-full">
<span class="font-label-caps text-secondary">PROFİL RENGİ</span>
<div class="flex flex-wrap gap-2 mt-1" data-group="renk">
<button type="button" class="pill-choice selected-renk px-4 py-2 rounded-full font-button-text text-[13px] transition-colors selected" data-value="7016 Mat">7016 Mat</button>
<button type="button" class="pill-choice selected-renk px-4 py-2 rounded-full font-button-text text-[13px] transition-colors" data-value="Beyaz Mat">Beyaz Mat</button>
<button type="button" class="pill-choice selected-renk px-4 py-2 rounded-full font-button-text text-[13px] transition-colors" data-value="Siyah Mat">Siyah Mat</button>
<button type="button" id="renk-diger-btn" class="pill-choice selected-renk px-4 py-2 rounded-full font-button-text text-[13px] transition-colors" data-value="Diğer">Diğer</button>
</div>
<div id="ral-input-wrap" class="flex flex-col gap-1.5 w-full mt-1" style="display:none;">
<label class="font-label-caps text-secondary" for="f-ral">RAL KODU</label>
<input id="f-ral" type="text" inputmode="numeric" value="RAL " placeholder="Örn: RAL 9006" class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary font-body-lg text-on-surface py-2 outline-none placeholder:text-outline transition-colors"/>
</div>
</div>

<!-- Aksesuar Tipi -->
<div class="flex flex-col gap-2 w-full">
<span class="font-label-caps text-secondary">AKSESUAR TİPİ</span>
<div class="flex flex-wrap gap-2 mt-1" data-group="aksesuar">
<button type="button" class="pill-choice selected-aksesuar px-4 py-2 rounded-full font-button-text text-[13px] transition-colors selected" data-value="Kayışlı">Kayışlı</button>
<button type="button" class="pill-choice selected-aksesuar px-4 py-2 rounded-full font-button-text text-[13px] transition-colors" data-value="Zincirli">Zincirli</button>
</div>
</div>

</div>
<!-- Bottom Nav -->
<div class="w-full pb-4 pt-6 flex gap-3">
<button id="back-btn" class="flex-1 h-[56px] rounded-full border-2 border-primary text-primary font-button-text flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
<span class="text-[16px]">GERİ</span>
</button>
<button id="next-btn" class="flex-1 h-[56px] rounded-full bg-primary-container text-on-primary font-button-text flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-[0.98]">
<span class="text-[16px]">İLERİ</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  var ralInput = document.getElementById('f-ral');
  ralInput.addEventListener('input', function() {
    var value = ralInput.value;
    if (value.slice(0, 4) !== 'RAL ') {
      value = 'RAL ' + value.replace(/^R?A?L?\s*/, '');
    }
    var kod = value.slice(4).replace(/[^0-9]/g, '');
    ralInput.value = 'RAL ' + kod;
  });
  ralInput.addEventListener('keydown', function(e) {
    if ((e.key === 'Backspace' || e.key === 'Delete') && ralInput.selectionStart <= 4 && ralInput.selectionEnd <= 4) {
      e.preventDefault();
    }
  });
  ralInput.addEventListener('focus', function() {
    if (ralInput.selectionStart < 4) ralInput.setSelectionRange(ralInput.value.length, ralInput.value.length);
  });

  document.querySelectorAll('[data-group]').forEach(function(group) {
    group.querySelectorAll('.pill-choice').forEach(function(btn) {
      btn.addEventListener('click', function() {
        group.querySelectorAll('.pill-choice').forEach(function(b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        if (group.getAttribute('data-group') === 'renk') {
          var ralWrap = document.getElementById('ral-input-wrap');
          ralWrap.style.display = (btn.id === 'renk-diger-btn') ? 'flex' : 'none';
        }
      });
    });
  });
  document.getElementById('back-btn').addEventListener('click', function() {
    window.location.href = '../giyometre_proje_bilgileri/code.html';
  });
  document.getElementById('next-btn').addEventListener('click', function() {
    var state = JSON.parse(localStorage.getItem('giyometreState') || '{}');
    state.cam = document.querySelector('[data-group="cam"] .selected').getAttribute('data-value');
    var renkBtn = document.querySelector('[data-group="renk"] .selected');
    state.renk = renkBtn.getAttribute('data-value');
    state.ralKod = (renkBtn.id === 'renk-diger-btn') ? document.getElementById('f-ral').value : '';
    state.aksesuar = document.querySelector('[data-group="aksesuar"] .selected').getAttribute('data-value');
    localStorage.setItem('giyometreState', JSON.stringify(state));
    window.location.href = '../giyometre_olcu_adet_girisi/code.html';
  });
</script>
<style>
.pill-choice:not(.selected) { background: transparent !important; color: #251912 !important; border-color: #e0c0b0 !important; }
</style>
</main>
</body></html>
